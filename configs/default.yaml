paper:
  slug: ssfd-a-robust-two-stage-face-detector
  title: SSFD+ — A Robust Two-Stage Face Detector
  doi: 10.1109/TBIOM.2019.2928118
source_code:
  url: null
  commit: null
data:
  root: ../../datasets/wider-face
  max_train_samples: null
  max_val_samples: null
model:
  name: ssfd_plus
  min_side: 800
  max_long: 1200
  pretrained_backbone: true
  use_cam: true
train:
  batch_size: 1
  epochs: 10
  lr: 0.001
  lr_gamma: 0.1
  lr_decay_epoch: 7
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 4
  log_every: 50
  use_amp: true
eval:
  batch_size: 1
  score_thresh: 0.05
  nms_thresh: 0.5
  metric: wider_map
paths:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  pred_dir: outputs/predictions
  figure_dir: outputs/figures
report:
  title: SSFD+ Face Detection Report
  embed_format: svg
device: cuda
